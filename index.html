<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Asistencia</title>

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background-color: #F9F8F5;
  font-family: 'Montserrat', sans-serif;
  color: #1A1A1A;
  padding: 28px 15px 45px;
}

.contenedor{
  width:100%;
  max-width:800px;
  margin:auto;
}

.tarjeta{
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(190, 14, 35, 0.25);
  border-radius: 25px;
  padding: 30px;
  box-shadow: 0 15px 45px rgba(190, 14, 35, 0.08);
}

.titulo{
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 32px;
  color: #BE0E23;
  margin: 0 0 20px;
  font-weight: 700;
  letter-spacing: 1px;
}

.estadisticas{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 20px 0;
}

.estadistica{
  background: #FAF7F2;
  border: 1px solid #EAE5D9;
  border-radius: 14px;
  padding: 12px 8px;
  text-align: center;
}

.estadistica strong{
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  color: #BE0E23;
  line-height: 1;
}

.estadistica span{
  display: block;
  margin-top: 5px;
  font-size: 10px;
  color: #666666;
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 600;
}

.controles{
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.busqueda{
  flex: 1;
  padding: 13px 15px;
  border-radius: 12px;
  border: 1px solid #EAE5D9;
  background: #FFFFFF;
  outline: none;
  font-family: 'Montserrat', sans-serif;
  color: #1A1A1A;
  font-size: 13px;
}

.busqueda:focus{
  border-color: #BE0E23;
  box-shadow: 0 0 8px rgba(190, 14, 35, 0.2);
}

.tabla-wrap{
  overflow-x: auto;
  border: 1px solid #EAE5D9;
  border-radius: 15px;
}

table{
  width: 100%;
  border-collapse: collapse;
}

thead th{
  background: linear-gradient(135deg, #BE0E23 0%, #7A0917 100%);
  color: #ffffff;
  font-family: 'Cinzel', serif;
  font-size: 14px;
  font-weight: 600;
  padding: 14px 12px;
  text-align: left;
  letter-spacing: 0.5px;
}

thead th:nth-child(2),
thead th:nth-child(3){
  text-align: center;
}

tbody td{
  padding: 12px;
  border-bottom: 1px solid #F0E8E0;
  font-size: 13px;
  vertical-align: middle;
}

tbody tr:last-child td{ border-bottom: none; }
tbody tr:hover{ background: #FAF7F2; }

.nombre{
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: #1A1A1A;
  text-transform: capitalize;
}

.asistentes-num {
  text-align: center;
  font-weight: 700;
  color: #BE0E23;
  font-size: 16px;
}

.badge-confirmacion {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
}
.badge-si { background: #E2F0D9; color: #385723; }
.badge-no { background: #FDE8E8; color: #BE0E23; }

.vacio{
  padding: 35px 15px;
  text-align: center;
  color: #BE0E23;
  font-size: 13px;
  font-style: italic;
}

.pie{
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.guardado{
  font-size: 11px;
  color: #BE0E23;
  font-weight: 500;
}

.boton-secundario{
  background: linear-gradient(135deg, #BE0E23 0%, #7A0917 100%);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 30px;
  color: #ffffff;
  padding: 10px 20px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(190, 14, 35, 0.25);
  transition: opacity 0.2s;
}

.boton-secundario:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

@media(max-width:600px){
  body{ padding: 12px 6px 25px; }
  .tarjeta{ padding: 18px 12px; }
  .titulo{ font-size: 24px; }
  .estadisticas{ grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="contenedor">
  <div class="tarjeta">

    <h1 class="titulo">Panel de Asistencia</h1>

    <div class="estadisticas">
      <div class="estadistica">
        <strong id="totalRegistros">0</strong>
        <span>Total Registros</span>
      </div>
      <div class="estadistica">
        <strong id="totalAsistiran">0</strong>
        <span>Confirmaron (Sí)</span>
      </div>
      <div class="estadistica">
        <strong id="totalAsistentes">0</strong>
        <span>Total de Asistentes</span>
      </div>
    </div>

    <div class="controles">
      <input id="buscar" class="busqueda" type="text" placeholder="Buscar invitado..." autocomplete="off">
    </div>

    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Nombre Completo</th>
            <th>¿Asistirá?</th>
            <th>Nº Asistentes</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
      <div id="vacio" class="vacio">
        Cargando datos...
      </div>
    </div>

    <div class="pie">
      <div class="guardado" id="guardado">Sincronizando...</div>
      <button id="btnActualizar" class="boton-secundario" onclick="cargarListaDesdeServidor()">Actualizar datos</button>
    </div>

  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzBiXmk2q6qgGJMhtwU9y2ixYSuXvFU9ClGlOqgJ8dHvmXh_9voTacTPVrp85wECQn4-Q/exec";

let invitados = [];
const buscar = document.getElementById('buscar');

document.addEventListener('DOMContentLoaded', () => {
  cargarListaDesdeServidor();
  buscar.addEventListener('input', mostrarLista);
  setInterval(cargarListaDesdeServidor, 8000);
});

function llamarAPI(parametros) {
  return new Promise((resolve, reject) => {
    const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
    const script = document.createElement('script');
    const query = new URLSearchParams({ ...parametros, callback });
    const tiempo = setTimeout(() => { limpiar(); reject("Tiempo agotado"); }, 12000);

    window[callback] = function(data) {
      clearTimeout(tiempo);
      limpiar();
      resolve(data);
    };

    function limpiar() {
      delete window[callback];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    script.onerror = function() {
      clearTimeout(tiempo);
      limpiar();
      reject("Error de conexión");
    };

    script.src = API_URL + '?' + query.toString();
    document.body.appendChild(script);
  });
}

async function cargarListaDesdeServidor() {
  const btn = document.getElementById('btnActualizar');
  const guardado = document.getElementById('guardado');
  btn.disabled = true;

  try {
    const datos = await llamarAPI({ action: 'obtenerTodos' });
    if (Array.isArray(datos)) {
      invitados = datos;
      mostrarLista();
      guardado.textContent =
        'Sincronizado · ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } else {
      console.warn("La respuesta de la API no es un arreglo válido:", datos);
    }
  } catch (e) {
    console.warn("Error sincronizando:", e);
    guardado.textContent = 'Error de conexión con el servidor.';
    const vacio = document.getElementById('vacio');
    if (!invitados.length) {
      vacio.style.display = 'block';
      vacio.textContent = 'No se pudieron obtener los datos. Revisa la configuración de Apps Script.';
    }
  } finally {
    btn.disabled = false;
  }
}

function mostrarLista() {
  const tbody = document.getElementById('lista');
  const vacio = document.getElementById('vacio');
  const termino = buscar.value.trim().toLowerCase();

  tbody.innerHTML = '';

  const filtrados = invitados.filter(inv => {
    const nombre = String(inv.nombre || '').toLowerCase();
    return nombre.includes(termino);
  });

  if (!invitados.length) {
    vacio.style.display = 'block';
    vacio.textContent = 'No hay registros guardados.';
  } else if (!filtrados.length) {
    vacio.style.display = 'block';
    vacio.textContent = 'No se encontraron resultados.';
  } else {
    vacio.style.display = 'none';

    filtrados.forEach(inv => {
      const tr = document.createElement('tr');

      // 1. Nombre
      const tdNombre = document.createElement('td');
      tdNombre.innerHTML = `<div class="nombre">${escapar(inv.nombre || '')}</div>`;

      // 2. ¿Asistirá?
      const tdAsistencia = document.createElement('td');
      tdAsistencia.style.textAlign = 'center';
      const asistenciaTexto = String(inv.asistencia || 'No').trim();
      const esSi = asistenciaTexto.toLowerCase() === 'sí' || asistenciaTexto.toLowerCase() === 'si';
      
      tdAsistencia.innerHTML = `<span class="badge-confirmacion ${esSi ? 'badge-si' : 'badge-no'}">${escapar(asistenciaTexto)}</span>`;

      // 3. Número de asistentes
      const tdAsistentes = document.createElement('td');
      tdAsistentes.className = 'asistentes-num';
      tdAsistentes.textContent = esSi ? (inv.asistentes || 0) : 0;

      tr.appendChild(tdNombre);
      tr.appendChild(tdAsistencia);
      tr.appendChild(tdAsistentes);
      tbody.appendChild(tr);
    });
  }

  actualizarEstadisticas();
}

function actualizarEstadisticas() {
  document.getElementById('totalRegistros').textContent = invitados.length;

  const siAsistiran = invitados.filter(inv => {
    const ast = String(inv.asistencia || '').trim().toLowerCase();
    return ast === 'sí' || ast === 'si';
  }).length;
  
  document.getElementById('totalAsistiran').textContent = siAsistiran;

  const sumaAsistentes = invitados.reduce((sum, inv) => {
    const ast = String(inv.asistencia || '').trim().toLowerCase();
    const esSi = ast === 'sí' || ast === 'si';
    return sum + (esSi ? Number(inv.asistentes || 0) : 0);
  }, 0);

  document.getElementById('totalAsistentes').textContent = sumaAsistentes;
}

function escapar(texto) {
  return String(texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
